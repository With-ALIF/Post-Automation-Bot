<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="50%" stop-color="#001F54" />
      <stop offset="100%" stop-color="#034078" />
    </linearGradient>

    <!-- Metallic Gloss / Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0077FE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Robot Face Plate Gradient -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D2A44" />
      <stop offset="100%" stop-color="#0E1626" />
    </linearGradient>

    <!-- Visor / Eye Glow Gradient -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>

    <!-- Brand Cyan-Blue Accent -->
    <linearGradient id="fbBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877F2" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>

    <!-- Gold / Alert Accent for "Report" -->
    <linearGradient id="reportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#EF476F" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Subtle Circuit / Tech Accent Grid Lines -->
  <g opacity="0.12" stroke="#00F0FF" stroke-width="2" stroke-linecap="round">
    <path d="M 60 140 H 130 L 160 170 H 220" fill="none" />
    <path d="M 452 140 H 382 L 352 170 H 292" fill="none" />
    <path d="M 60 370 H 150 L 180 340 H 210" fill="none" />
    <path d="M 452 370 H 362 L 332 340 H 302" fill="none" />
    <circle cx="220" cy="170" r="4" fill="#00F0FF" />
    <circle cx="292" cy="170" r="4" fill="#00F0FF" />
    <circle cx="210" cy="340" r="4" fill="#00F0FF" />
    <circle cx="302" cy="340" r="4" fill="#00F0FF" />
  </g>

  <!-- Antenna & Signal Waves -->
  <g filter="url(#neonGlow)">
    <line x1="256" y1="126" x2="256" y2="82" stroke="#00F0FF" stroke-width="6" stroke-linecap="round" />
    <circle cx="256" cy="74" r="10" fill="#00F0FF" />
    <!-- Signal Pulses -->
    <path d="M 232 58 C 246 48 266 48 280 58" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M 220 44 C 242 30 270 30 292 44" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Robot Ears / Side Nodes -->
  <rect x="110" y="210" width="22" height="60" rx="11" fill="url(#fbBlueGrad)" filter="url(#dropShadow)" />
  <rect x="380" y="210" width="22" height="60" rx="11" fill="url(#fbBlueGrad)" filter="url(#dropShadow)" />

  <!-- Robot Head / Main Chassis -->
  <rect x="126" y="126" width="260" height="220" rx="56" fill="url(#faceGrad)" stroke="#1F355B" stroke-width="4" filter="url(#dropShadow)" />

  <!-- Head Top Bevel Highlight -->
  <path d="M 170 134 Q 256 128 342 134" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Visor Screen -->
  <rect x="156" y="174" width="200" height="96" rx="28" fill="#060C17" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.6" />

  <!-- Futuristic Glowing Eyes / HUD Display -->
  <g filter="url(#neonGlow)">
    <!-- Left Cyber Eye -->
    <rect x="180" y="202" width="54" height="38" rx="12" fill="url(#visorGrad)" />
    <circle cx="207" cy="221" r="7" fill="#FFFFFF" />

    <!-- Right Cyber Eye -->
    <rect x="278" y="202" width="54" height="38" rx="12" fill="url(#visorGrad)" />
    <circle cx="305" cy="221" r="7" fill="#FFFFFF" />
  </g>

  <!-- Robot Mouth / Audio Visualizer Bar -->
  <g opacity="0.85">
    <rect x="214" y="296" width="12" height="12" rx="3" fill="#00F0FF" />
    <rect x="232" y="292" width="12" height="20" rx="3" fill="#00F0FF" />
    <rect x="250" y="288" width="12" height="28" rx="3" fill="#00F0FF" />
    <rect x="268" y="292" width="12" height="20" rx="3" fill="#00F0FF" />
    <rect x="286" y="296" width="12" height="12" rx="3" fill="#00F0FF" />
  </g>

  <!-- Floating Shield Badge: "FB Report" Icon at Bottom Right -->
  <g transform="translate(310, 275)" filter="url(#dropShadow)">
    <!-- Shield Outer -->
    <path d="M 40 10 L 80 26 C 80 66 60 98 40 110 C 20 98 0 66 0 26 Z" fill="#0B132B" stroke="#00F0FF" stroke-width="3" />
    <!-- Shield Inner Fill -->
    <path d="M 40 16 L 74 30 C 74 64 56 92 40 102 C 24 92 6 64 6 30 Z" fill="url(#fbBlueGrad)" opacity="0.9" />

    <!-- "f" Logo Stylized on Shield -->
    <text x="35" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">f</text>

    <!-- Report Checkmark / Pulse Indicator Badge -->
    <circle cx="70" cy="30" r="14" fill="url(#reportGrad)" stroke="#0B132B" stroke-width="2.5" />
    <path d="M 64 30 L 68 34 L 77 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Bottom Label Pill: "FB REPORT BOT" -->
  <g filter="url(#dropShadow)">
    <rect x="116" y="392" width="280" height="58" rx="29" fill="#071329" stroke="url(#borderGrad)" stroke-width="2.5" />
    <text x="256" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="21" font-weight="800" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">
      FB REPORT BOT
    </text>
  </g>
</svg>

